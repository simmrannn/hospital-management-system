<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management System</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .section {
            border: 1px solid #ccc;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        .hidden {
            display: none;
        }

        h2 {
            margin-top: 0;
        }

        input,
        select,
        button {
            display: block;
            margin-bottom: 10px;
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }
    </style>
</head>

<body>

    <h1>Hospital Management System</h1>

    <div id="auth-section">
        <div class="section">
            <h2>Login</h2>
            <input type="text" id="login-username" placeholder="Username">
            <input type="password" id="login-password" placeholder="Password">
            <button onclick="login()">Login</button>
            <p id="login-msg"></p>
        </div>

        <div class="section">
            <h2>Register Doctor</h2>
            <input type="text" id="doc-username" placeholder="Username">
            <input type="email" id="doc-email" placeholder="Email">
            <input type="password" id="doc-password" placeholder="Password">
            <input type="text" id="doc-specialization" placeholder="Specialization">
            <button onclick="register('doctor')">Register Doctor</button>
            <p id="doc-msg"></p>
        </div>

        <div class="section">
            <h2>Register Patient</h2>
            <input type="text" id="pat-username" placeholder="Username">
            <input type="email" id="pat-email" placeholder="Email">
            <input type="password" id="pat-password" placeholder="Password">
            <input type="text" id="pat-address" placeholder="Address">
            <button onclick="register('patient')">Register Patient</button>
            <p id="pat-msg"></p>
        </div>
    </div>

    <div id="dashboard-section" class="hidden">
        </select>
        <input type="date" id="app-date">
        <input type="time" id="app-time">
        <button onclick="bookAppointment()">Book Appointment</button>
        <p id="book-msg"></p>
    </div>
    </div>

    <script>
        let token = localStorage.getItem('token');
        let currentUser = null;

        const API_BASE = '/api';

        function showMsg(id, msg, isError = false) {
            const el = document.getElementById(id);
            el.textContent = msg;
            el.className = isError ? 'error' : 'success';
        }

        async function register(type) {
            const username = document.getElementById(type === 'doctor' ? 'doc-username' : 'pat-username').value;
            const email = document.getElementById(type === 'doctor' ? 'doc-email' : 'pat-email').value;
            const password = document.getElementById(type === 'doctor' ? 'doc-password' : 'pat-password').value;

            const data = { username, email, password, role: type };
            if (type === 'doctor') {
                data.specialization = document.getElementById('doc-specialization').value;
            } else {
                data.address = document.getElementById('pat-address').value;
            }

            try {
                const res = await fetch(`${API_BASE}/auth/register/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify(data)
                });
                const json = await res.json();
                if (res.ok) {
                    showMsg(type === 'doctor' ? 'doc-msg' : 'pat-msg', 'Registered successfully! Please login.');
                } else {
                    const errorMsg = json.non_field_errors ? json.non_field_errors[0] : (json.detail || JSON.stringify(json));
                    showMsg(type === 'doctor' ? 'doc-msg' : 'pat-msg', errorMsg, true);
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function logout() {
            await fetch(`${API_BASE}/auth/logout/`, { method: 'POST' });
            updateUI(false);
        }

        async function updateUI(isLoggedIn) {
            document.getElementById('auth-section').classList.toggle('hidden', isLoggedIn);
            document.getElementById('dashboard-section').classList.toggle('hidden', !isLoggedIn);

            if (isLoggedIn && currentUser) {
                document.getElementById('user-name').textContent = currentUser.username;
                document.getElementById('user-role').textContent = currentUser.role;

                if (currentUser.role === 'doctor') {
                    document.getElementById('doctor-controls').classList.remove('hidden');
                    document.getElementById('patient-controls').classList.add('hidden');
                } else {
                    document.getElementById('doctor-controls').classList.add('hidden');
                    document.getElementById('patient-controls').classList.remove('hidden');
                    loadDoctors();
                }
            }
        }

        async function loadDoctors() {
            const res = await fetch(`${API_BASE}/doctor/list/`); // Adjust endpoint if needed
            if (res.ok) {
                const doctors = await res.json();
                const sel = document.getElementById('doctor-select');
                sel.innerHTML = '<option value="">Select Doctor</option>';
                doctors.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d.id;
                    opt.textContent = `Dr. ${d.user.username} (${d.specialization})`;
                    sel.appendChild(opt);
                });
            }
        }

        async function bookAppointment() {
            const doctorId = document.getElementById('doctor-select').value;
            const date = document.getElementById('app-date').value;
            const time = document.getElementById('app-time').value;

            const res = await fetch(`${API_BASE}/patient/book-appointment/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ doctor: doctorId, date, time })
            });

            if (res.ok) {
                showMsg('book-msg', 'Appointment booked!');
            } else {
                showMsg('book-msg', 'Failed to book', true);
            }
        }

        async function addAvailability() {
            const start = document.getElementById('avail-start').value;
            const end = document.getElementById('avail-end').value;

            if (!start || !end) {
                showMsg('avail-msg', 'Please select both start and end times.', true);
                return;
            }

            const res = await fetch(`${API_BASE}/doctor/availability/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ start_time: start, end_time: end })
            });

            if (res.ok) {
                showMsg('avail-msg', 'Availability added!');
            } else {
                showMsg('avail-msg', 'Failed to add availability', true);
            }
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
</body>

</html>
